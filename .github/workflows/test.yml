name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          cache: true
          run_install: false
          package_json_file: package.json
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm run build
      - run: pnpm test

  e2e:
    # Drives a real dotnet build and a browser, so it is kept separate from the
    # unit job: a failure here means a built dist would not boot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.x"

      - name: Install .NET WASM workloads
        run: dotnet workload install wasm-tools wasm-experimental

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          cache: true
          run_install: false
          package_json_file: package.json
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install

      - name: Install the example's dependencies
        run: pnpm install
        working-directory: examples/my-javascript-app

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:e2e
